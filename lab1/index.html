<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="calculator">

    <input type="text" id="display" value="0" readonly>

    <!--Память-->
    <div class="memory-buttons">
        <button onclick="memoryAdd()">M+</button>
        <button onclick="memorySubtract()">M-</button>
        <button onclick="memoryRead()">MR</button>
        <button onclick="memorySave()">MS</button>
    </div>

    <!--Кнопки-->
    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="light" onclick="memoryClear()">MC</button>
        <button class="light" onclick="percent()">%</button>
        <button class="operator" onclick="chooseOperation('/')">÷</button>

        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button class="operator" onclick="chooseOperation('*')">×</button>

        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button class="operator" onclick="chooseOperation('-')">−</button>

        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button class="operator" onclick="chooseOperation('+')">+</button>

        <button class="zero" onclick="addNumber('0')">0</button>
        <button onclick="addNumber(',')">,</button>
        <button class="equals" onclick="calculate()">=</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
