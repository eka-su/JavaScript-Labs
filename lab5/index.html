<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Криптовалютный рынок и инвестиционный портфель"
    />
    <title>CoinTrack</title>
    <!-- Разрешаем браузеру заранее подготовить соединение с API -->
    <link rel="preconnect" href="https://api.coingecko.com" />
    <link rel="stylesheet" href="./styles.css" />
    <!-- Сторонняя библиотека для графика -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
    <!-- Главный файл приложения. Он импортирует остальные JS-модули -->
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="header__inner container">
        <a class="brand" href="#home" aria-label="CoinTrack — главная">
          <span class="brand__mark">$</span>
          <span>Tracker</span>
        </a>

        <nav class="nav" aria-label="Основная навигация">
          <a class="nav__link" href="#home" data-route="home">Рынок</a>
          <a class="nav__link" href="#portfolio" data-route="portfolio">Портфель</a>
        </nav>
      </div>
    </header>

    <main class="container main" id="app" tabindex="-1"></main>

    <div class="toast" id="toast" role="alert" aria-live="assertive" hidden>
      <div>
        <strong id="toast-title">Ошибка</strong>
        <p id="toast-message"></p>
      </div>
      <button class="toast__close" id="toast-close" type="button" aria-label="Закрыть">×</button>
    </div>

  </body>
</html>
